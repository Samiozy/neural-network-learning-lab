[project]
name = "nnll-api"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi==0.115.6",
  "numpy==2.2.1",
  "pydantic==2.10.4",
  "uvicorn[standard]==0.34.0",
]

[project.optional-dependencies]
dev = ["httpx==0.28.1", "mypy==1.14.1", "pytest==8.3.4", "ruff==0.8.4"]

[tool.pytest.ini_options]
testpaths = ["apps/api/tests"]
pythonpath = ["apps/api"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = true

